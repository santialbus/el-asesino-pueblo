<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Plantilla de El Asesino. `tool/setup.sh` la copia a web/index.html.
       Fondo oscuro en toda la página: iOS pinta con este color las franjas que
       Flutter no cubre (barra de estado, bajo la barra de Safari, indicador de inicio). -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="El Asesino — El Pueblo Duerme. Juego social de deducción multijugador.">

  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101014">

  <!-- iOS (PWA añadida a inicio) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "black": barra de estado negra y la app debajo; evita que el contenido quede bajo el reloj -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="El Asesino">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>El Asesino — El Pueblo Duerme</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #101014;   /* mismo color que AppColors.bg */
      overflow: hidden;            /* Flutter gestiona su propio scroll */
      overscroll-behavior: none;   /* sin "rebote" blanco al arrastrar en iOS */
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: el_asesino
description: "EL ASESINO — EL PUEBLO DUERME. Juego social de deducción multijugador (Flutter + Firebase Spark)."
publish_to: none
version: 0.9.0-beta.1+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  asesino_core:
    path: packages/asesino_core
  flutter_riverpod: ^2.6.1
  firebase_core: ">=3.8.0 <5.0.0"
  firebase_auth: ">=5.3.4 <7.0.0"
  cloud_firestore: ">=5.5.0 <7.0.0"
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
